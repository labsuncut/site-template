# Runs on every push and pull request: checks that no link on the site is broken.
name: Site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links between pages and files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.html'
          fail: true
